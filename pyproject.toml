[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentine-graph-engineering"
version = "0.1.0"
description = "Graph engineering toolkit with opentine-native record/fork/replay provenance for any graph framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
keywords = [
  "opentine",
  "graph engineering",
  "agent graphs",
  "provenance",
  "fork",
  "replay",
  "langgraph",
  "mcp",
]
dependencies = ["opentine>=0.2.0,<0.5"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/graph-engineering-opentine"
Source = "https://github.com/0xcircuitbreaker/graph-engineering-opentine"
Issues = "https://github.com/0xcircuitbreaker/graph-engineering-opentine/issues"
Changelog = "https://github.com/0xcircuitbreaker/graph-engineering-opentine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = ["typer>=0.12"]
mcp = ["mcp>=1.0"]
langgraph = ["langgraph-checkpoint>=2.0"]
dev = ["pytest>=8", "ruff>=0.6", "typer>=0.12", "mcp>=1.0"]

[project.scripts]
graphforge = "graphforge.cli:app"
graphforge-mcp = "graphforge.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphforge"]

# Enumerated rather than left to .gitignore: an untracked directory in the
# working tree (a scratch virtualenv, local editor state) otherwise lands in
# the sdist, and a published artifact cannot be unpublished.
[tool.hatch.build.targets.sdist]
include = [
  "src/graphforge",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/graphforge/cli.py" = ["B008"]
